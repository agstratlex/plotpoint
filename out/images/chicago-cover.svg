<svg width="600" height="750" viewBox="0 0 600 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2E9F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A14"/>
      <stop offset="100%" stop-color="#12122A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="300" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="56" font-weight="800" fill="#F5F0E0" letter-spacing="0.04em">PLOT POINTS</text>

  <!-- Skyline base glow -->
  <ellipse cx="300" cy="520" rx="250" ry="15" fill="#FF2E9F" opacity="0.15" filter="url(#bigGlow)"/>

  <!-- Buildings group -->
  <g filter="url(#glow)">
    <!-- Willis Tower (Sears Tower) - center -->
    <rect x="270" y="180" width="60" height="340" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
    <rect x="280" y="160" width="15" height="20" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
    <rect x="305" y="165" width="15" height="15" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.7"/>
    <line x1="285" y1="160" x2="285" y2="140" stroke="#FF2E9F" stroke-width="1.5" opacity="0.8"/>
    <!-- Windows -->
    <line x1="280" y1="220" x2="320" y2="220" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="260" x2="320" y2="260" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="300" x2="320" y2="300" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="340" x2="320" y2="340" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="380" x2="320" y2="380" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="420" x2="320" y2="420" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="460" x2="320" y2="460" stroke="#00E5FF" stroke-width="0.5" opacity="0.3"/>
    <line x1="300" y1="180" x2="300" y2="520" stroke="#00E5FF" stroke-width="0.5" opacity="0.2"/>

    <!-- Marina City towers (left) -->
    <rect x="170" y="280" width="40" height="240" rx="20" fill="none" stroke="#FF2E9F" stroke-width="2" opacity="0.8"/>
    <rect x="215" y="290" width="40" height="230" rx="20" fill="none" stroke="#FF2E9F" stroke-width="2" opacity="0.8"/>
    <!-- Balcony lines -->
    <line x1="170" y1="310" x2="210" y2="310" stroke="#FF2E9F" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="340" x2="210" y2="340" stroke="#FF2E9F" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="370" x2="210" y2="370" stroke="#FF2E9F" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="400" x2="210" y2="400" stroke="#FF2E9F" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="430" x2="210" y2="430" stroke="#FF2E9F" stroke-width="0.5" opacity="0.4"/>

    <!-- Hancock-style tower (right) -->
    <path d="M 370 230 L 360 520 L 420 520 L 410 230 Z" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.8"/>
    <line x1="385" y1="220" x2="385" y2="230" stroke="#FF2E9F" stroke-width="2" opacity="0.8"/>
    <line x1="390" y1="215" x2="390" y2="230" stroke="#FF2E9F" stroke-width="2" opacity="0.8"/>
    <!-- Cross bracing -->
    <line x1="365" y1="280" x2="415" y2="380" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="415" y1="280" x2="365" y2="380" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="363" y1="380" x2="417" y2="480" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="417" y1="380" x2="363" y2="480" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>

    <!-- Smaller buildings -->
    <rect x="120" y="380" width="35" height="140" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5"/>
    <rect x="435" y="350" width="40" height="170" fill="none" stroke="#FF2E9F" stroke-width="1.5" opacity="0.5"/>
    <rect x="480" y="400" width="30" height="120" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
    <rect x="85" y="420" width="28" height="100" fill="none" stroke="#FF2E9F" stroke-width="1" opacity="0.4"/>

    <!-- Bridge element -->
    <path d="M 100 510 Q 200 490 300 510 Q 400 490 500 510" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.5"/>
    <line x1="150" y1="510" x2="150" y2="495" stroke="url(#neonGlow)" stroke-width="1" opacity="0.4"/>
    <line x1="250" y1="510" x2="250" y2="500" stroke="url(#neonGlow)" stroke-width="1" opacity="0.4"/>
    <line x1="350" y1="510" x2="350" y2="500" stroke="url(#neonGlow)" stroke-width="1" opacity="0.4"/>
    <line x1="450" y1="510" x2="450" y2="495" stroke="url(#neonGlow)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Ground line -->
  <line x1="60" y1="520" x2="540" y2="520" stroke="url(#neonGlow)" stroke-width="1.5" opacity="0.6"/>

  <!-- Film strip (left) -->
  <g opacity="0.25" transform="rotate(-20, 120, 300)">
    <rect x="90" y="150" width="60" height="300" rx="3" fill="none" stroke="#C7C9CC" stroke-width="1.5"/>
    <rect x="95" y="160" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
    <rect x="95" y="180" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
    <rect x="95" y="200" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
    <rect x="133" y="160" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
    <rect x="133" y="180" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
    <rect x="133" y="200" width="12" height="10" rx="1" fill="#C7C9CC" opacity="0.3"/>
  </g>

  <!-- Clapperboard (right) -->
  <g opacity="0.25" transform="rotate(15, 490, 250)">
    <rect x="460" y="200" width="70" height="50" rx="2" fill="none" stroke="#C7C9CC" stroke-width="1.5"/>
    <rect x="460" y="190" width="70" height="15" rx="2" fill="none" stroke="#C7C9CC" stroke-width="1.5"/>
    <line x1="475" y1="190" x2="470" y2="205" stroke="#C7C9CC" stroke-width="1"/>
    <line x1="490" y1="190" x2="485" y2="205" stroke="#C7C9CC" stroke-width="1"/>
    <line x1="505" y1="190" x2="500" y2="205" stroke="#C7C9CC" stroke-width="1"/>
    <line x1="520" y1="190" x2="515" y2="205" stroke="#C7C9CC" stroke-width="1"/>
  </g>

  <!-- City name -->
  <text x="300" y="640" text-anchor="middle" font-family="system-ui,sans-serif" font-size="64" font-weight="800" fill="#F5F0E0" letter-spacing="0.03em">CHICAGO</text>

  <!-- Subtitle -->
  <text x="300" y="675" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#C7C9CC" letter-spacing="0.3em" opacity="0.5">FILMING LOCATIONS GUIDE</text>

  <!-- Bottom glow -->
  <ellipse cx="300" cy="700" rx="200" ry="30" fill="#0066FF" opacity="0.05" filter="url(#bigGlow)"/>
</svg>
